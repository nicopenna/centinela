# =====================================================================
#  Centinela - Integraciones con software de administración de consorcios
#  Edita este archivo y volvé a correr:  python3 sincronizar.py
#  Las claves también se pueden pasar por variables de entorno
#  (ADMINIA_API_KEY, UNITIFY_EMAIL, UNITIFY_PASSWORD, UNITIFY_WEBHOOK_SECRET)
#  para no dejarlas escritas en el archivo. NO subas este archivo con claves a Drive.
# =====================================================================

[general]
# Dónde se guarda el archivo que se importa en la app Centinela
carpeta_salida = salida
# Meses hacia atrás que se leen de gastos y cobros
meses = 3
# Días hacia atrás que se leen de reclamos
dias_reclamos = 60

# Avisar por Telegram cuando entra un reclamo nuevo o una unidad pasa a deber
# (usa el mismo bot que la demo de la Raspberry). Vacío = no avisa.
telegram_token =
telegram_chat_ids =

# ---------------------------------------------------------------------
#  ADMINIA MANAGER  (REST, solo lectura)
#  La clave se crea en Adminia: Configuración > Integraciones > API & Webhooks
# ---------------------------------------------------------------------
[adminia]
# si = se sincroniza | no = se saltea
activo = si
# real = usa la API | simulado = datos de prueba | auto = real si hay clave
modo = auto
api_key =
base_url = https://api.adminiamanager.com/v1
# El límite es 60/min; se deja margen
pedidos_por_minuto = 55
# Plan gratis: 1.000 pedidos por mes. Avisa al pasar este porcentaje
cupo_mensual = 1000
avisar_cupo_pct = 80
# IDs de edificio de Adminia separados por coma. Vacío = todos
edificios =

# ---------------------------------------------------------------------
#  UNITIFY  (GraphQL; requiere plan Pro y un usuario de servicio)
# ---------------------------------------------------------------------
[unitify]
activo = si
modo = auto
# Confirmar con Unitify la URL de producción. Esta es la del playground.
graphql_url = https://app.unitify.com/admin/api
email =
password =
# Para crear reclamos en Unitify desde alarmas de Centinela
organizacion_id =
crear_reclamos_desde_alarmas = no
# Webhooks de pago (la URL hay que pedirla a soporte de Unitify)
webhook_puerto = 8090
webhook_secret =
edificios =
