<title>Centinela</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de uso diario con mascota (Lechu, una lechuza que vigila). Escritorio = menú lateral; celular = barra inferior.
   Formas redondeadas, celeste calmo de base, caramelo cálido en el personaje, rojo solo para lo urgente. */
:root{
  --bg:#edf5f7; --panel:#ffffff; --sunk:#e3eef2; --line:#d0e0e6; --fg:#1b2b33; --muted:#5a707c;
  --accent:#23788a; --accent-soft:#d5edf1; --on-accent:#ffffff;
  --ok:#2e8051; --ok-soft:#ddf1e4; --warn:#a86300; --warn-soft:#fcecd3; --crit:#c2362e; --crit-soft:#fadfdc; --trend:#4a5fc1; --trend-soft:#e3e8fb;
  --owl:#b87a45; --owl-dark:#8b5832; --owl-belly:#f1dcc2; --owl-face:#fbf0e1; --beak:#eba33a; --eye:#23292e; --blush:#f2a39b;
  --shadow:0 1px 2px rgba(20,60,72,.05),0 6px 18px rgba(20,60,72,.07);
  --r-card:22px; --r-item:16px;
  --f-display:"Fredoka","Nunito",system-ui,sans-serif; --f-body:"Nunito",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a21; --panel:#16252e; --sunk:#1d303b; --line:#294050; --fg:#e4eef2; --muted:#98adb8;
  --accent:#6cc6d5; --accent-soft:#1b3d46; --on-accent:#0b1d22;
  --ok:#62c48a; --ok-soft:#173a28; --warn:#f2aa45; --warn-soft:#3e2d12; --crit:#f26b62; --crit-soft:#47201d; --trend:#93a8ff; --trend-soft:#242f57;
  --owl-face:#f3e4cf; --blush:#d98b84;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a21; --panel:#16252e; --sunk:#1d303b; --line:#294050; --fg:#e4eef2; --muted:#98adb8;
  --accent:#6cc6d5; --accent-soft:#1b3d46; --on-accent:#0b1d22;
  --ok:#62c48a; --ok-soft:#173a28; --warn:#f2aa45; --warn-soft:#3e2d12; --crit:#f26b62; --crit-soft:#47201d; --trend:#93a8ff; --trend-soft:#242f57;
  --owl-face:#f3e4cf; --blush:#d98b84;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:32px;line-height:1.05}
h2{font-size:24px;line-height:1.1}
h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
h4{margin:0;font-size:16px;font-weight:600}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:500;min-height:42px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.ok{background:var(--ok);border-color:var(--ok);color:var(--on-accent);font-weight:600}
button.danger{color:var(--crit);border-color:var(--crit)}
button.link{align-self:flex-start;border:0;background:none;color:var(--accent);padding:4px 0;min-height:0;text-decoration:underline;text-underline-offset:3px}
button.sm{min-height:34px;padding:5px 11px;font-size:14px}
button[disabled]{opacity:.5;cursor:default}

/* Estructura */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.04em;padding:0 10px 4px}
.who{padding:0 10px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:6px}
.who b{color:var(--fg);display:block;font-size:14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;text-align:left;width:100%;padding:9px 10px;border-radius:10px;font-weight:500}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:21px;height:21px;flex:none}
.nav .badge{margin-left:auto}
.badge{background:var(--crit);color:var(--on-accent);border-radius:999px;font-size:12px;font-weight:600;padding:0 7px;min-width:20px;text-align:center;line-height:20px}
.main{min-width:0;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--line);grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{border:0;border-radius:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:8px 2px 9px;color:var(--muted);position:relative;min-height:58px}
  .tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
  .tabbar svg{width:23px;height:23px}
  .tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);font-size:10px;line-height:16px;min-width:16px;padding:0 4px}
  .mtop{display:flex!important}
}
.mtop{display:none;justify-content:space-between;align-items:center;gap:10px}
.mtop .brand{padding:0;font-size:24px}

/* Encabezado de pantalla */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.head p{color:var(--muted);max-width:62ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* Tarjetas */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px;align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}

.todo{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px;border-radius:12px;background:var(--sunk)}
.item.crit{background:var(--crit-soft)} .item.warn{background:var(--warn-soft)} .item.trend{background:var(--trend-soft)} .item.okb{background:var(--ok-soft)}
.item .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--panel);grid-row:span 2}
.item .ic svg{width:21px;height:21px}
.item .tt{font-weight:600;min-width:0}
.item .ss{font-size:13px;color:var(--muted);min-width:0;grid-column:2}
.item{grid-template-columns:auto minmax(0,1fr)}
.item .rr{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.item .ic{grid-row:span 3;align-self:start}
.item.click{cursor:pointer}
.item.click:hover{outline:1px solid var(--accent)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.trend{background:var(--trend-soft);color:var(--trend)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.trend{background:var(--trend)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;min-width:0;text-align:left;box-shadow:var(--shadow);min-height:0}
.stat span{font-size:12px;color:var(--muted);font-weight:500}
.stat b{font-family:var(--f-display);font-size:36px;line-height:1.1;font-weight:600}
.stat.crit b{color:var(--crit)} .stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}

.eqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.eq{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel);min-width:0}
.eq header{display:flex;gap:9px;align-items:center}
.eq header svg{width:22px;height:22px;color:var(--accent);flex:none}
.eq .rd{font-family:var(--f-mono);font-size:14px}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:600;border-bottom:0}

.big{font-family:var(--f-display);font-size:44px;font-weight:600;line-height:1}
.hist{display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line);padding-left:12px}
.hist div{font-size:13.5px}
.hist time{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.steps span.done{background:var(--accent-soft);color:var(--accent)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--sunk);cursor:pointer}
.chk input{width:24px;height:24px;margin:0;accent-color:var(--ok);flex:none}
.chk.done{background:var(--ok-soft)}
.chk.done span{color:var(--muted);text-decoration:line-through}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:34px;padding:5px 12px;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--panel);font-weight:600;box-shadow:var(--shadow)}
.banner{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--fg);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--accent-soft)}
.select{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;min-height:42px}

/* Elegir rol */
.pick{max-width:880px;margin:0 auto;padding-block:36px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.pick .brand{padding:0;font-size:34px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.roles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.roles{grid-template-columns:minmax(0,1fr)}}
.role{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:16px;border-radius:14px;min-height:0;box-shadow:var(--shadow)}
.role svg{width:30px;height:30px;color:var(--accent)}
.role b{font-size:17px}
.role span{font-size:13px;color:var(--muted);font-weight:400}

/* Formulario modal */
.scrim{position:fixed;inset:0;background:rgba(8,16,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:600;font-size:14px}
.field small{color:var(--muted);font-size:12.5px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field.chkf{flex-direction:row;align-items:center;gap:10px}
.field.chkf input{width:22px;min-height:22px;height:22px}
.sheet .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-20px;background:var(--panel);padding-top:6px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:500;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (min-width:821px){.toast{bottom:24px}}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .2s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}

/* ===== Estilo Lechu (redondeado y amable) ===== */
body{font-size:16px}
h1,h2{font-weight:600;letter-spacing:0}
h1{font-size:30px} h2{font-size:22px}
h3{text-transform:none;letter-spacing:0;font-size:14px;font-weight:800;color:var(--muted)}
button{border-radius:999px;font-weight:700;padding:9px 18px}
button.sm{padding:5px 14px}
button.link{border-radius:0}
.card{border-radius:var(--r-card);padding:18px;border-color:transparent}
.stat{border-radius:20px;border-color:transparent}
.item{border-radius:var(--r-item)}
.item .ic{border-radius:50%}
.eq{border-radius:18px}
.empty{border-radius:20px;border-style:solid;border-width:0;background:var(--sunk);gap:6px}
.empty .owl{width:64px;height:64px}
.sheet{border-radius:26px 26px 0 0}
@media (min-width:700px){.sheet{border-radius:26px}}
.field input,.field select,.field textarea,.select{border-radius:14px}
.seg{border-radius:999px} .seg button{border-radius:999px}
.nav button{border-radius:999px}
.role{border-radius:22px;border-color:transparent}
.chk{border-radius:16px}
.pill{font-weight:700}
.banner{border-radius:18px}
.brand{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;font-size:24px;display:flex;align-items:center;gap:8px}
.brand .owl{width:38px;height:38px;flex:none}
.brand small{display:block;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0;line-height:1}
.hero{display:flex;gap:12px;align-items:flex-start}
.hero .owl{width:104px;height:104px;flex:none;margin-bottom:-6px}
.hero .say{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:10px}
.bubble{position:relative;background:var(--panel);border-radius:22px;padding:14px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.bubble::before{content:"";position:absolute;left:-9px;top:30px;width:20px;height:20px;background:var(--panel);transform:rotate(45deg);border-radius:4px}
.bubble b{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.15;position:relative}
.bubble span{color:var(--muted);position:relative}
.hero.alert .bubble{background:var(--warn-soft)} .hero.alert .bubble::before{background:var(--warn-soft)}
.hero.crit .bubble{background:var(--crit-soft)} .hero.crit .bubble::before{background:var(--crit-soft)}
@media (max-width:520px){.hero .owl,.pick .hero .owl{width:68px;height:68px}.bubble{padding:12px 14px}.bubble b{font-size:20px}.bubble::before{top:22px}}
.toast{display:flex;align-items:center;gap:10px;border-radius:999px;padding:8px 18px 8px 8px}
.toast .owl{width:34px;height:34px;flex:none;background:var(--owl-face);border-radius:50%}
.loading .owl{width:120px;height:120px}
.owl .eye{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .owl-calm .eye{animation:blink 5.5s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
  .owl-happy{animation:hop 1.6s ease-in-out 2}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .owl-alert .tufts{animation:perk 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
  @keyframes perk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}
}
.pick .hero .owl{width:130px;height:130px}

a.pill{text-decoration:none}
/* ===== Esquemas de edificio y equipos ===== */
.scheme{width:100%;min-width:560px;height:auto;display:block;max-height:560px}
.scheme-wrap{overflow-x:auto;margin-inline:-6px}
.scheme text{font-family:var(--f-body);fill:var(--fg)}
.scheme .lbl{font-size:12px;font-weight:700}
.scheme .sub{font-size:10.5px;fill:var(--muted)}
.scheme .zone{font-size:11px;font-weight:800;fill:var(--muted);letter-spacing:.06em}
.scheme .eqn{cursor:pointer}
.scheme .eqn:hover circle.ring,.scheme .eqn:focus circle.ring{stroke-width:5}
.scheme .eqn:focus{outline:none}
.eqdraw{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.eqdraw text{font-family:var(--f-body)}
.sens{display:flex;flex-direction:column;gap:8px}
.sens div{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px;align-items:start}
.sens i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;grid-row:span 2}
.sens b{font-size:15px}
.sens span{font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
</style>

<div id="root"><div class="loading">Lechu se está despertando…</div></div>
<div id="modal"></div>

<script>
(function(){
"use strict";
/* ================= Utilidades ================= */
var $=function(s,el){return (el||document).querySelector(s)};
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var fmtM=new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});
function money(n){return fmtM.format(Math.round(+n||0))}
function num(v){if(typeof v==="number")return v;var s=String(v||"").replace(/[^\d,.-]/g,"");if(s.indexOf(",")>-1)s=s.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");return parseFloat(s)||0}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function periodNow(){return today().slice(0,7)}

function daysTo(d){if(!d)return null;return Math.round((new Date(d+"T12:00:00")-new Date(today()+"T12:00:00"))/86400000)}

/* ================= Cálculos ================= */
function liqId(ed,per){return ed+"_"+per}
function liqCalc(ed,per){
  var gs=where("gastos",function(g){return g.edificioId===ed&&g.periodo===per});
  var ord=0,ext=0;gs.forEach(function(g){if(g.tipo==="extraordinaria")ext+=num(g.monto);else ord+=num(g.monto)});
  var L=byId("liquidaciones",liqId(ed,per))||{};var fpct=L.fondoPct!=null?num(L.fondoPct):10;var fondo=ord*fpct/100;
  return {gastos:gs,ord:ord,ext:ext,fondo:fondo,fpct:fpct,total:ord+fondo+ext,L:L,estado:L.estado||"borrador"};
}
function unitShare(u,c){var p=num(u.porcentual)/100;return {ord:(c.ord+c.fondo)*p,ext:c.ext*p,total:c.total*p}}
function unitAccount(u){
  var liqs=where("liquidaciones",function(l){return l.edificioId===u.edificioId&&l.estado==="emitida"});
  var deb=0,rows=[];liqs.forEach(function(l){var c=liqCalc(u.edificioId,l.periodo);var s=unitShare(u,c);deb+=s.total;rows.push({per:l.periodo,share:s,vence:l.vence})});
  var pag=where("pagos",function(p){return p.unidadId===u.id&&p.estado==="confirmado"});var paid=pag.reduce(function(a,p){return a+num(p.monto)},0);
  rows.sort(function(a,b){return a.per<b.per?1:-1});
  return {deuda:deb-paid,rows:rows,paid:paid};
}
function provOk(p){var a=daysTo(p.artVence),s=daysTo(p.seguroVence);return !(a!=null&&a<0)&&!(s!=null&&s<0)}

    var n=ALN[a.nivel]||ALN.aviso;var eq=byId("equipos",a.equipoId);var age=alarmAge(a);
    var esc2=a.estado==="abierta"&&a.nivel!=="tendencia"?(age>120?pill(["crit","Escalada al administrador"]):age>30?pill(["warn","Sin respuesta "+Math.round(age)+" min"]):""):"";
    var st=a.estado==="tomada"?pill(["trend",(a.tomadaRol==="encargado"?"Encargado":"Operador")+" en camino"]):a.estado==="resuelta"?pill(["ok","Resuelta"]):"";
    var acts="";
    if(a.estado!=="resuelta"&&ctx.rol!=="consejo"){
      if(a.estado==="abierta")acts+='<button class="sm pri" data-a="takeAlarm" data-id="'+a.id+'">'+(ctx.rol==="encargado"?"Estoy yendo":"Me ocupo")+'</button>';
      acts+='<button class="sm ok" data-a="solveAlarm" data-id="'+a.id+'">Resuelta</button>';
      if(!compact&&(ctx.rol==="operador")&&!a.otId)acts+='<button class="sm" data-a="newOT" data-alarm="'+a.id+'">Crear OT</button>';
    }
    return '<div class="item '+n[0]+'"><span class="ic">'+ic(eq?eq.tipo:"bell")+'</span><span class="tt">'+esc(a.titulo)+'</span><span class="ss">'+esc(edName(a.edificioId))+(eq?" · "+esc(eq.nombre):"")+' · '+ago(a.creado)+(a.detalle?" · "+esc(a.detalle):"")+(a.otId?" · con OT":"")+'</span><span class="rr">'+pill(n)+esc2+st+acts+'</span></div>';
  }).join("")+'</div>';

function impLimpio(d){var o={};Object.keys(d).forEach(function(k){if(k==="id")return;var v=d[k];if(v===null||typeof v==="string"||typeof v==="number"||typeof v==="boolean")o[k]=typeof v==="string"?v.slice(0,2000):v});return o}
function impMerge(col,prev,nuevo){
  if(!prev){nuevo.creado=nuevo.creado||Date.now();nuevo.por=ME.id||null;return nuevo}
  var m=Object.assign({},prev);
  Object.keys(nuevo).forEach(function(k){var v=nuevo[k];if(v===null||v==="")return;if(k==="porcentual"&&!num(v)&&num(prev.porcentual))return;m[k]=v});
  // Lo que se trabajó en Centinela no se pisa: reclamo con OT o ya resuelto acá
  if(col==="reclamos"&&prev.estado&&(prev.otId||prev.estado==="resuelto")&&nuevo.estado!=="resuelto")m.estado=prev.estado;
  if(col==="liquidaciones"&&prev.estado==="emitida"&&prev.emitida&&prev.origen==null)return prev;
  delete m.id;return m;
}
function impParse(txt){var d=JSON.parse(txt);if(!d||d.formato!=="centinela-import/1"||typeof d.colecciones!=="object")throw new Error("formato");
  IMPCOLS.forEach(function(k){var l=d.colecciones[k];if(l&&!Array.isArray(l))throw new Error("formato");d.colecciones[k]=(l||[]).filter(function(x){return x&&typeof x.id==="string"&&/^[A-Za-z0-9_-]{1,120}$/.test(x.id)})});
  return d}

var killTimer=setTimeout(function(){if(!READY){FAIL="La base de datos no respondió. Recargá la página o abrila desde claude.ai.";render()}},10000);
function markLoaded(c){loaded[c]=1;if(!READY&&COLS.every(function(k){return loaded[k]})){READY=true;clearTimeout(killTimer)}render()}
function start(){
  if(!window.claude||!window.claude.use){FAIL="Esta app funciona abierta desde claude.ai, donde tiene su base de datos.";render();return}
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    DB=r[0];USER=r[1];
    if(!DB){FAIL="No hay acceso a la base de datos en esta vista. Entrá con tu cuenta de claude.ai.";clearTimeout(killTimer);render();return}
    if(USER){USER.me().then(function(m){ME={id:m.id,name:m.name||""};render()}).catch(function(){});
      Promise.resolve(USER.can?USER.can("data.write"):null).then(function(v){if(v===false){CANW=false;render()}}).catch(function(){})}
    COLS.forEach(function(c){DB.collection(c).onSnapshot(function(snap){S[c]=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});markLoaded(c)},function(err){if(err&&err.code==="revoked"){FAIL="Se quitó el acceso a esta app.";render()}else markLoaded(c)})});
  }).catch(function(){FAIL="No se pudo conectar con la base de datos.";render()});
}
start();
