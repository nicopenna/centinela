# =====================================================================
#  Centinela - Demo Raspberry Pi 3B+  (configuracion)
#  Edita este archivo y reinicia el servicio:
#      sudo systemctl restart centinela
# =====================================================================

[general]
# Nombre que aparece en los mensajes de Telegram y en el tablero
sitio = Esc. Primaria N° 12 · Comuna 9 (demo)
equipo = Tanque de reserva + bomba elevadora
# Cada cuantos segundos se toma una muestra
intervalo_s = 2
# Puerto del tablero web (http://IP-DE-LA-RASPBERRY:8080)
puerto_web = 8080
# Guarda cada muestra en data/registro_AAAA-MM-DD.csv
guardar_csv = si

[telegram]
# NO pongas el token aca: este archivo se sube a GitHub.
# Copia config.local.ini.ejemplo como config.local.ini y ponelo ahi (ese no se sube).
# Token que te da @BotFather (ver LEEME.md, paso 5). Vacio = no manda mensajes
token =
# Uno o mas chat_id separados por coma. Para obtenerlo:
#     python3 centinela_demo.py --chat-id
chat_ids =
# Si una alerta sigue activa, se vuelve a avisar cada N minutos (0 = nunca)
reaviso_min = 30
# Avisar tambien cuando una alerta se normaliza
avisar_normalizado = si

# ---------------------------------------------------------------------
#  NIVEL DE TANQUE  (HC-SR04, el unico conectado en la demo)
# ---------------------------------------------------------------------
[nivel]
# real = lee el HC-SR04 | simulado = valores inventados
modo = real
gpio_trigger = 23
gpio_echo = 24
# Distancia del sensor a la superficie con el tanque VACIO y LLENO (cm).
# Para la demo en la mesa: 40 cm = vacio, 5 cm = lleno (mover la mano o una tapa)
distancia_vacio_cm = 40
distancia_lleno_cm = 5
# Capacidad del tanque, solo para mostrar litros
capacidad_litros = 10000
# Alertas de nivel (%)
nivel_bajo_pct = 35
nivel_critico_pct = 15
# Descenso rapido: si baja mas de X % por minuto (promedio de la ventana) avisa
descenso_rapido_pct_min = 20
ventana_descenso_s = 20

# ---------------------------------------------------------------------
#  CORRIENTE DE BOMBA  (SCT-013-030 + ADS1115)  - en la demo: simulado
# ---------------------------------------------------------------------
[corriente]
modo = simulado
i2c_direccion = 0x48
# SCT-013-030: 30 A -> 1 V eficaz.  amperes = Vrms * factor
factor_a_por_v = 30.0
# Tiempo de muestreo para calcular el valor eficaz (s)
ventana_rms_s = 0.4
# Por encima de esto se considera que la bomba esta funcionando
umbral_encendida_a = 0.8
# Corriente nominal de la bomba (A) (chapa del motor)
nominal_a = 4.5
# Sobrecorriente: mas de X veces la nominal
sobrecorriente_factor = 1.3
# Marcha en seco / sin carga: menos de X veces la nominal estando encendida
marcha_seco_factor = 0.6
# Funcionamiento continuo maximo (s). En un edificio real seria 20-40 min
marcha_max_s = 120
# Si la bomba esta encendida X s y el nivel no sube, avisa (no bombea)
sin_llenado_s = 40

# ---------------------------------------------------------------------
#  VIBRACION  (ADXL345 por I2C)  - en la demo: simulado
# ---------------------------------------------------------------------
[vibracion]
modo = simulado
i2c_direccion = 0x53
ventana_s = 0.5
# Vibracion eficaz (g) que dispara alarma directa
alarma_g = 0.25
# Ademas, "comportamiento anomalo": se aprende lo normal de la bomba y se
# avisa si una medida se aleja mas de N desvios del promedio aprendido
anomalia_desvios = 4
muestras_aprendizaje = 30

# ---------------------------------------------------------------------
#  SIMULACION (solo afecta a los sensores en modo simulado)
# ---------------------------------------------------------------------
[simulacion]
# La bomba simulada arranca y para segun el nivel (como un automatico de tanque)
arranque_pct = 40
parada_pct = 90
