<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centinela en vivo</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#667085;--bd:#e3e7ee;--acc:#0b6bcb;
--ok:#12a150;--av:#d9a400;--al:#e8740c;--cr:#d92d20;--agua:#3b9be8}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#171e28;--tx:#e6ebf2;--mut:#93a0b3;--bd:#263040;--acc:#5aa9ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
.brand{font-weight:800;font-size:20px;letter-spacing:.3px}.brand span{color:var(--acc)}
.sub{color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--bd)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
main{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:280px 1fr}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:0 0 10px}
.tank{position:relative;height:300px;border:3px solid var(--mut);border-top:none;border-radius:0 0 18px 18px;overflow:hidden;margin:8px 20px 10px}
.water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--agua),#1f6fb8);transition:height .8s}
.mark{position:absolute;left:0;right:0;border-top:2px dashed;font-size:11px;padding-left:4px}
.big{font-size:40px;font-weight:800;text-align:center}.big small{font-size:16px;color:var(--mut);font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:600px){.grid3{grid-template-columns:1fr}}
.kpi .v{font-size:28px;font-weight:800}.kpi .u{color:var(--mut);font-size:14px}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--mut);margin-left:6px;font-weight:600}
svg{width:100%;height:110px;display:block}
.alert{border-left:5px solid;padding:8px 12px;border-radius:8px;background:var(--bg);margin-bottom:8px;white-space:pre-line}
.critica{border-color:var(--cr)}.alerta{border-color:var(--al)}.aviso{border-color:var(--av)}.ok{border-color:var(--ok)}
.ev{font-size:13px;padding:5px 0;border-bottom:1px solid var(--bd);display:flex;gap:8px}.ev b{min-width:62px;color:var(--mut);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.col{display:grid;gap:16px;align-content:start}
.empty{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<header>
  <div><div class="brand">🦉 Centi<span>nela</span> <span class="sub">· alerta temprana en vivo</span></div>
  <div class="sub" id="sitio">—</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <span class="pill" id="bomba"><span class="dot"></span>Bomba —</span>
    <span class="pill" id="tg">Telegram —</span>
    <span class="pill" id="conn"><span class="dot"></span>En vivo</span>
    <a class="pill" href="/" style="color:var(--acc);text-decoration:none">🏫 Sistema por rol</a>
    <a class="pill" href="/analisis" style="color:var(--acc);text-decoration:none">📈 Análisis de largo plazo →</a>
  </div>
</header>
<main>
  <div class="col">
    <section class="card">
      <h2>Tanque de reserva <span class="tag" id="mNivel"></span></h2>
      <div class="tank" id="tank"><div class="water" id="water" style="height:0"></div></div>
      <div class="big" id="nivel">—<small> %</small></div>
      <div class="sub" style="text-align:center" id="litros">—</div>
    </section>
  </div>
  <div class="col">
    <section class="card">
      <h2>Alertas activas</h2>
      <div id="alertas"></div>
    </section>
    <section class="grid3">
      <div class="card kpi"><h2>Nivel <span class="tag" id="mNivel2"></span></h2><div><span class="v" id="kNivel">—</span> <span class="u">%</span></div><svg id="gNivel"></svg></div>
      <div class="card kpi"><h2>Corriente bomba <span class="tag" id="mCorr"></span></h2><div><span class="v" id="kCorr">—</span> <span class="u">A</span></div><svg id="gCorr"></svg></div>
      <div class="card kpi"><h2>Vibración bomba <span class="tag" id="mVib"></span></h2><div><span class="v" id="kVib">—</span> <span class="u">g</span></div><svg id="gVib"></svg></div>
    </section>
    <section class="card">
      <h2>Simular fallas (se pueden combinar; tocá de nuevo para quitar)</h2>
      <div class="btns" id="fallas"></div>
    </section>
    <section class="card">
      <h2>Registro de eventos</h2>
      <div id="eventos"></div>
    </section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt=(v,d)=>v==null?'—':v.toFixed(d);
function chart(svg,hist,key,lines,color){
  const W=svg.clientWidth||300,H=110,p=4;
  const pts=hist.filter(h=>h[key]!=null);
  if(pts.length<2){svg.innerHTML='';return}
  const t0=pts[0].t,t1=pts[pts.length-1].t||t0+1;
  let mx=Math.max(...pts.map(h=>h[key]),...lines.map(l=>l.v))*1.1,mn=0;
  if(key==='nivel_pct')mx=100;
  const X=t=>p+(t-t0)/(t1-t0||1)*(W-2*p),Y=v=>H-p-(v-mn)/(mx-mn||1)*(H-2*p);
  let d=pts.map((h,i)=>(i?'L':'M')+X(h.t).toFixed(1)+' '+Y(h[key]).toFixed(1)).join('');
  let s=lines.map(l=>`<line x1="0" x2="${W}" y1="${Y(l.v)}" y2="${Y(l.v)}" stroke="${l.c}" stroke-dasharray="4 4" stroke-width="1.2"/>`).join('');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=s+`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>`;
}
let fallasPintadas=false;
async function tick(){
  try{
    const r=await fetch('/api/estado');const s=await r.json();
    $('conn').innerHTML='<span class="dot"></span>En vivo';
    $('sitio').textContent=s.sitio+' · '+s.equipo;
    const m=s.ultimo||{},u=s.umbrales;
    const nv=m.nivel_pct;
    $('water').style.height=(nv||0)+'%';
    $('water').style.background=nv==null?'#999':nv<u.critico?'linear-gradient(#f0605a,#b42318)':nv<u.bajo?'linear-gradient(#f5a14a,#c4550a)':'';
    $('nivel').innerHTML=fmt(nv,0)+'<small> %</small>';
    $('litros').textContent=m.litros==null?'Sin lectura del sensor':`≈ ${m.litros} litros · distancia ${m.dist_cm} cm`;
    const tank=$('tank');tank.querySelectorAll('.mark').forEach(e=>e.remove());
    [[u.bajo,'bajo',css('--al')],[u.critico,'crítico',css('--cr')]].forEach(([v,t,c])=>{const e=document.createElement('div');e.className='mark';e.style.bottom=v+'%';e.style.borderColor=c;e.style.color=c;e.textContent=t+' '+v+'%';tank.appendChild(e)});
    $('kNivel').textContent=fmt(nv,0);$('kCorr').textContent=fmt(m.corriente_a,2);$('kVib').textContent=fmt(m.vibracion_g,3);
    $('mNivel').textContent=$('mNivel2').textContent=s.modo.nivel;$('mCorr').textContent=s.modo.corriente;$('mVib').textContent=s.modo.vibracion;
    $('bomba').innerHTML=`<span class="dot" style="background:${m.bomba_on?css('--ok'):'#999'}"></span>Bomba ${m.bomba_on?'ENCENDIDA'+(m.marcha_s?' · '+m.marcha_s+' s':''):'apagada'}`+(m.aprendiendo?' · aprendiendo':'');
    $('tg').innerHTML=`<span class="dot" style="background:${s.telegram?css('--ok'):css('--av')}"></span>Telegram ${s.telegram?'conectado':'sin configurar'}`;
    chart($('gNivel'),s.hist,'nivel_pct',[{v:u.bajo,c:css('--al')},{v:u.critico,c:css('--cr')}],css('--agua'));
    chart($('gCorr'),s.hist,'corriente_a',[{v:u.nominal,c:css('--mut')},{v:u.sobre,c:css('--cr')}],css('--acc'));
    chart($('gVib'),s.hist,'vibracion_g',[{v:u.vib,c:css('--cr')}],'#8e44ad');
    $('alertas').innerHTML=s.alertas.length?s.alertas.map(a=>`<div class="alert ${a.nivel}"><b>${a.nivel.toUpperCase()}</b> · desde ${a.desde}\n${a.texto}</div>`).join(''):'<div class="alert ok">✅ Todo en orden. Sin alertas activas.</div>';
    $('eventos').innerHTML=s.eventos.length?s.eventos.slice(0,15).map(e=>`<div class="ev"><b>${e.hora}</b><span class="alert ${e.nivel}" style="margin:0;padding:2px 8px;flex:1">${e.texto.split('\n')[0]}</span></div>`).join(''):'<div class="empty">Sin eventos todavía.</div>';
    if(!fallasPintadas){fallasPintadas=true;$('fallas').innerHTML=Object.entries(s.fallas).map(([k,v])=>`<button data-f="${k}" title="${v}">${v}</button>`).join('');
      $('fallas').onclick=e=>{const f=e.target.dataset.f;if(f)fetch('/api/falla/'+f,{method:'POST'}).then(tick)}}
    const act=s.activas||[];document.querySelectorAll('#fallas button').forEach(b=>b.classList.toggle('on',b.dataset.f==='normal'?!act.length:act.includes(b.dataset.f)));
  }catch(e){$('conn').innerHTML=`<span class="dot" style="background:${css('--cr')}"></span>Sin conexión`}
}
tick();setInterval(tick,2000);
</script>
</body>
</html>
