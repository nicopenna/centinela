<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centinela Escuelas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: estilo portal de trámites. Encabezado blanco con navegación en pastillas (activa en amarillo), banda de contexto con el usuario, línea amarilla, contenido centrado en columna de ~1040 px con tablas de cabecera gris azulada y pestañas grises */
:root{
  --bg:#ffffff; --band:#f6f7f9; --head:#e8edf2; --line:#d9dee4; --fg:#2b2f33; --muted:#5f6b76;
  --yellow:#ffd200; --yellow-ink:#2b2f33; --link:#0f6fb3; --link-soft:#e3f0fa;
  --ok:#1f7a45; --ok-soft:#ddf1e4; --warn:#a85d00; --warn-soft:#fdeccc; --crit:#c62828; --crit-soft:#fbe0e0; --off:#6b7680; --off-soft:#eceff2;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif; --f-mono:"Roboto Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15191d; --band:#1b2025; --head:#232a31; --line:#323b44; --fg:#e7ebef; --muted:#9aa6b1;
  --yellow:#ffd200; --yellow-ink:#1b1d1f; --link:#6db7ee; --link-soft:#1d3346;
  --ok:#5cc489; --ok-soft:#173a26; --warn:#f2a845; --warn-soft:#3d2c10; --crit:#f26b6b; --crit-soft:#46201f; --off:#9aa4ad; --off-soft:#272e35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191d; --band:#1b2025; --head:#232a31; --line:#323b44; --fg:#e7ebef; --muted:#9aa6b1;
  --yellow:#ffd200; --yellow-ink:#1b1d1f; --link:#6db7ee; --link-soft:#1d3346;
  --ok:#5cc489; --ok-soft:#173a26; --warn:#f2a845; --warn-soft:#3d2c10; --crit:#f26b6b; --crit-soft:#46201f; --off:#9aa4ad; --off-soft:#272e35; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:1080px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}

/* encabezado */
.hdr{border-bottom:1px solid var(--line);background:var(--bg)}
.hdr .col{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:8px;background:var(--yellow);color:var(--yellow-ink);display:grid;place-items:center;font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand b{display:block;font-size:18px;font-weight:700;line-height:1.15}
.brand small{display:block;font-size:13px;color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:0;border-radius:8px;padding:8px 12px;font-size:15px;font-weight:600;color:var(--fg)}
.nav button:hover{background:var(--band)}
.nav button[aria-current="page"]{background:var(--yellow);color:var(--yellow-ink)}
.ctx{border-bottom:2px solid var(--yellow);background:var(--bg)}
.ctx .col{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px}
.sel{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);font-size:14px}
.sel select{border:0;background:var(--bg);font-weight:700;max-width:62vw}
.sel span{color:var(--muted)}
.clock{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.clock .now{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-right:2px}
.demo{background:var(--warn-soft);color:var(--warn);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 7px}

/* botones */
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--link);color:var(--link)}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.btn.pri:hover{filter:brightness(.96);color:var(--yellow-ink)}
.btn.lnk{border-color:transparent;color:var(--link);padding-inline:6px}
.btn.dan{color:var(--crit);border-color:var(--crit)}
.btn.sm{font-size:13px;padding:4px 10px}
.btn:disabled{opacity:.45;cursor:default}

/* contenido */
main.col{padding-block:22px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-size:20px;font-weight:700;margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:700;margin:0}
.lead{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:75ch}
.kv{display:flex;flex-direction:column;gap:4px;font-size:15px}
.kv b{font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.tile b{display:block;font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.k2 b{color:var(--crit)} .tile.k1 b{color:var(--warn)} .tile.k0 b{color:var(--ok)}

/* tablas estilo trámite */
.tbox{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--head);text-align:left;font-weight:700;padding:12px 14px;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--band)}
tr.on td{background:var(--link-soft)}
.cap{font-size:12.5px;color:var(--muted);margin-top:6px}

/* pestañas */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid var(--line);border-bottom:0;background:var(--head);border-radius:8px 8px 0 0;padding:8px 14px;font-weight:600;color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--bg);margin-bottom:-1px;padding-bottom:9px;font-weight:700}
.tabpane{border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:16px;display:flex;flex-direction:column;gap:14px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.lvE{background:var(--crit-soft);color:var(--crit)} .lvU{background:var(--warn-soft);color:var(--warn)} .lvP{background:var(--link-soft);color:var(--link)} .lvI{background:var(--off-soft);color:var(--off)}
.ok{background:var(--ok-soft);color:var(--ok)} .wa{background:var(--warn-soft);color:var(--warn)} .cr{background:var(--crit-soft);color:var(--crit)} .of{background:var(--off-soft);color:var(--off)} .in{background:var(--link-soft);color:var(--link)}

/* alertas */
.cards{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-left:5px solid var(--off);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.E{border-left-color:var(--crit)} .card.U{border-left-color:var(--warn)} .card.P{border-left-color:var(--link)}
.card.done{opacity:.6}
.card .data{font-family:var(--f-mono);font-size:12.5px;background:var(--band);border-radius:6px;padding:6px 9px}
.card .meta{font-size:13px;color:var(--muted)}
.late{color:var(--crit);font-weight:700}
.steps{display:flex;gap:4px;flex-wrap:wrap;font-size:12px}
.steps i{font-style:normal;background:var(--band);color:var(--muted);border-radius:999px;padding:1px 8px}
.steps i.on{background:var(--link-soft);color:var(--link);font-weight:700}
.big{font-size:22px;font-weight:800;line-height:1.25}
.sem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:600px){.sem{grid-template-columns:repeat(2,minmax(0,1fr))}}
.smf{border-radius:10px;padding:14px;background:var(--ok-soft)} .smf b{display:block;font-size:19px;font-weight:800;color:var(--ok)}
.smf.k1{background:var(--warn-soft)} .smf.k1 b{color:var(--warn)} .smf.k2{background:var(--crit-soft)} .smf.k2 b{color:var(--crit)}

.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.box{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.inbox .nt{display:grid;grid-template-columns:48px minmax(0,1fr);gap:0 10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.inbox .nt:first-of-type{border-top:0}
.inbox .t{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.inbox .why{grid-column:2;font-size:12.5px;color:var(--muted)}
.inbox .pend{opacity:.55}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.note{font-size:13px;color:var(--muted)}
input.f{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);min-width:0;width:100%;max-width:340px}
.formula{font-family:var(--f-mono);font-size:13px;background:var(--band);border-radius:8px;padding:10px 12px;overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--off-soft);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.w i{background:var(--warn)} .bar.c i{background:var(--crit)}
.lock{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.18);max-width:calc(100vw - 32px)}
/* demo en Raspberry: sensor en vivo y panel de simulación */
body{margin:0}
.live{border:2px solid var(--yellow);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;align-items:center}
.live .tq{position:relative;height:120px;border:3px solid var(--muted);border-top:0;border-radius:0 0 12px 12px;overflow:hidden;background:var(--band)}
.live .tq i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#5fb2ec,#1f74b8);transition:height .8s}
.live .tq i.w{background:linear-gradient(#f5b25a,#c4650a)} .live .tq i.c{background:linear-gradient(#f07a72,#b42318)}
.live .tq span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--fg);text-shadow:0 0 4px var(--bg)}
.live .lm{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.live .lm div{background:var(--band);border-radius:8px;padding:8px 10px;min-width:0}
.live .lm b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.live .lm small{font-size:12px;color:var(--muted)}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pl 1.6s infinite;vertical-align:middle;margin-right:4px}
.pulse.off{background:var(--off);animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(31,122,69,.5)}70%{box-shadow:0 0 0 8px rgba(31,122,69,0)}100%{box-shadow:0 0 0 0 rgba(31,122,69,0)}}
.simp{border-bottom:2px solid var(--yellow);background:var(--band)}
.simp .col{padding-block:14px;display:flex;flex-direction:column;gap:12px}
.simg{display:flex;flex-direction:column;gap:6px}
.simg h3{margin:0;font-size:14px;font-weight:800}
.simg .row{gap:6px}
.btn.tg[aria-pressed="true"]{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.btn.ni{border-style:dashed}
.why{font-size:13.5px;background:var(--link-soft);color:var(--fg);border-radius:6px;padding:7px 10px}
@media (max-width:600px){.live{grid-template-columns:1fr}.live .tq{height:90px;max-width:120px}}
</style>
</head>
<body>

<header class="hdr gut">
  <div class="col">
    <div class="brand"><div class="mark" aria-hidden="true">C</div><div><b>Centinela Escuelas</b><small>Propuesta para mantenimiento de edificios escolares · <span class="demo">Demo</span> · <span id="connChip"><span class="pulse off"></span>conectando…</span></small></div></div>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
  </div>
</header>
<div class="ctx gut">
  <div class="col">
    <label class="sel" for="rolSel"><span>Ingresó como:</span><select id="rolSel"></select></label>
    <div class="clock" aria-label="Reloj simulado">
      <span class="now" id="now"></span>
      <button class="btn sm" id="t30" type="button">+30 min</button>
      <button class="btn sm" id="t2h" type="button">+2 h</button>
      <button class="btn sm" id="t24" type="button">+1 día</button>
      <button class="btn sm dan" id="simBtn" type="button" aria-expanded="false">Simular situaciones ▾</button>
      <button class="btn sm" id="reset" type="button">Reiniciar</button>
    </div>
  </div>
</div>
<div class="simp gut" id="simPanel" hidden><div class="col" id="simBody"></div></div>
<main class="col gut" id="view" aria-live="polite"></main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const H = 3600e3, M = 60e3, D = 24*H;
let T0 = Math.floor(Date.now()/M)*M; // reloj real; los botones +30 min / +2 h / +1 día adelantan la hora simulada
let OFF = 0;
const LV = {E:'Emergencia', U:'Urgente', P:'Programado', I:'Informativo'};
const ROLES = [
  {id:'dg',  name:'Director General', who:'Dirección General', ctx:'Toda la Ciudad'},
  {id:'ger', name:'Gerente operativo', who:'Gerencia de Mantenimiento', ctx:'Toda la Ciudad'},
  {id:'sup', name:'Supervisor', who:'Marcos Ibarra', ctx:'Zona II · Comunas 8 y 9'},
  {id:'insp',name:'Inspectora', who:'Laura Benítez', ctx:'4 escuelas · Comuna 9'},
  {id:'emp', name:'Empresa contratista', who:'Mantenimientos Delta S.A.', ctx:'Representante Técnico'},
  {id:'esc', name:'Escuela', who:'Esc. Primaria N° 12', ctx:'Equipo directivo'},
  {id:'op',  name:'Operador Centinela', who:'Centro de monitoreo', ctx:'Sensores'}
];
const TABS = [
  {id:'ini', name:'Inicio', roles:'*'},
  {id:'ale', name:'Alertas', roles:'*'},
  {id:'os',  name:'Órdenes de servicio', roles:'dg ger sup insp emp'},
  {id:'cer', name:'Certificación', roles:'dg ger sup insp emp'},
  {id:'pre', name:'Preventivo', roles:'dg ger sup insp emp'},
  {id:'edi', name:'Edificios', roles:'*'},
  {id:'aud', name:'Auditoría', roles:'dg ger sup insp op'}
];
const EMP = {
  'Mantenimientos Delta S.A.':{total:4800e6, meses:24, cuota:200e6, hist:{resp:42, multas:1}},
  'Obras Sur S.R.L.':{total:3600e6, meses:24, cuota:150e6, hist:{resp:150, multas:3}},
  'Servicios Riachuelo S.A.':{total:3000e6, meses:24, cuota:125e6, hist:{resp:65, multas:0}}
};
const ESC = {
  e07:{n:'Esc. Primaria N° 7', z:'II', c:'Comuna 9', dir:'Av. Ejemplo 1200', insp:'Laura Benítez', emp:'Mantenimientos Delta S.A.', m2:2400, rel:100},
  e12:{n:'Esc. Primaria N° 12', z:'II', c:'Comuna 9', dir:'Calle Muestra 455', insp:'Laura Benítez', emp:'Mantenimientos Delta S.A.', m2:3100, rel:100},
  e18:{n:'Esc. Primaria N° 18', z:'II', c:'Comuna 9', dir:'Pasaje Demo 76', insp:'Laura Benítez', emp:'Mantenimientos Delta S.A.', m2:1900, rel:80},
  e09:{n:'Esc. Media N° 9', z:'II', c:'Comuna 9', dir:'Av. Prueba 3020', insp:'Laura Benítez', emp:'Mantenimientos Delta S.A.', m2:4200, rel:60},
  e04:{n:'Jardín N° 4', z:'II', c:'Comuna 8', dir:'Calle Ficticia 88', insp:'Pablo Ferreyra', emp:'Obras Sur S.R.L.', m2:900, rel:40},
  e21:{n:'Esc. Técnica N° 21', z:'II', c:'Comuna 8', dir:'Av. Modelo 5100', insp:'Pablo Ferreyra', emp:'Obras Sur S.R.L.', m2:5600, rel:20},
  e15:{n:'Esc. Primaria N° 15', z:'I', c:'Comuna 4', dir:'Calle Patrón 230', insp:'Diego Sosa', emp:'Servicios Riachuelo S.A.', m2:2200, rel:100},
  e03:{n:'Esc. Media N° 3', z:'I', c:'Comuna 4', dir:'Av. Plantilla 980', insp:'Diego Sosa', emp:'Servicios Riachuelo S.A.', m2:3800, rel:70}
};
const ME = {insp:'Laura Benítez', emp:'Mantenimientos Delta S.A.', esc:'e12', zona:'II'};
// Inventario: equipos por escuela
const EQT = {
  CA:{n:'Caldera', mod:'Humotubular a gas 250.000 kcal/h', sens:'Presión, temperatura, llama', rut:'Revisión de quemador y seguridades', f:1, pre:'Prueba pre-temporada (marzo)'},
  BO:{n:'Bomba de elevación', mod:'Centrífuga 3 HP, par alternado', sens:'Vibración, corriente, temperatura, presión', rut:'Revisión de rodamientos, sellos y tablero', f:3},
  TQ:{n:'Tanque de reserva', mod:'Hormigón 10.000 l', sens:'Nivel, flotante', rut:'Limpieza y desinfección', f:6},
  TT:{n:'Termotanque', mod:'Alta recuperación 150 l a gas', sens:'Temperatura, llama', rut:'Limpieza de sarro y ánodo', f:6},
  AS:{n:'Ascensor', mod:'Electromecánico 6 personas', sens:'Vibración, viajes, puerta', rut:'Mantenimiento de conservadora', f:1}
};
const INV = {
  e07:[['CA',2004],['BO',2015],['TQ',1978],['TT',2019]], e12:[['CA',1998],['BO',2012],['TQ',1985],['TT',2017]],
  e18:[['CA',2010],['BO',2009],['TQ',1990],['TT',2014]], e09:[['CA',2001],['BO',2016],['TQ',1972],['AS',2008]],
  e04:[['CA',2018],['BO',2018],['TQ',2018]], e21:[['CA',1995],['BO',2005],['TQ',1960],['AS',1999]],
  e15:[['CA',2012],['BO',2014],['TQ',1981],['TT',2020]], e03:[['CA',2007],['BO',2011],['TQ',1975],['AS',2013]]
};

const STEPS = ['Nueva','Recibida','En camino','Resuelta','Conformada'];
const ISO = ms => { const d = new Date(ms - 3*H); const p = n => String(n).padStart(2,'0'); return `${p(d.getUTCDate())}-${p(d.getUTCMonth()+1)}-${d.getUTCFullYear()} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`; };
const DAY = ms => ISO(ms).slice(0,10);
const HM = ms => ISO(ms).slice(11);
const dur = ms => ms < H ? Math.max(0,Math.round(ms/M))+' min' : ms < 48*H ? (Math.round(ms/H*10)/10).toString().replace('.',',')+' h' : Math.round(ms/D)+' días';
const ars = n => '$ ' + Math.round(n).toLocaleString('es-AR');
const h = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const esc = id => ESC[id];

let now, A, OS, LOG, PLAN, role = 'insp', tab = 'ini', sel = {os:null, edi:'e12', cerEmp:'Mantenimientos Delta S.A.', osTab:'doc', audF:''}, seq = 0;
try{ const r = localStorage.getItem('cent-esc-rol'); if (r && ROLES.some(x=>x.id===r)) role = r; }catch(e){}
const docNo = (tipo) => `${tipo}-2026-${46700000 + (++seq)*137}-GCABA-DGMCEE`;
const exNo = () => `EX-2026-${45961000 + (++seq)*211}- -GCABA-DGMCEE`;
const userOf = r => { const x = ROLES.find(y=>y.id===r); return `${x.who} (${x.name})`; };

function log(r, accion, objeto, detalle, t = now){ LOG.push({t, user:userOf(r), accion, objeto, detalle}); }

function seed(){
  T0 = Math.floor(Date.now()/M)*M; OFF = 0; now = T0; PIA = {}; seq = 0; LOG = []; OS = [];
  A = [
    {id:1, lv:'E', esc:'e07', eq:'Caldera', txt:'Sobrepresión en caldera', dato:'Presión 2,9 bar (máx. 2,5) · agua 96 °C', t:T0-10*M, st:0, plain:'No usar la sala de calderas. El técnico ya fue avisado.'},
    {id:2, lv:'U', esc:'e15', eq:'Caldera', txt:'Calefacción apagada en día de clase', dato:'Caldera sin llama desde 05:10 · aulas 13 °C', t:T0-3*H, st:1, plain:'La calefacción no funciona. La empresa ya fue avisada.'},
    {id:3, lv:'U', esc:'e04', eq:'Tanque', txt:'Tanque de reserva bajo', dato:'Nivel 18 % · bomba sin arrancar', t:T0-30*H, st:2, goAt:T0-29*H, plain:'Puede faltar agua en los baños.'},

function planState(p){

const open = a => a.st < 4;

function rules(a){
  const out = [], add = (r, at, why) => out.push({r, at, why});
  const t = a.t, takenAt = a.goAt ?? Infinity, closedAt = a.st === 4 ? (a.closeAt ?? now) : Infinity, resAt = a.resAt ?? Infinity;

  if (a.lv==='E' || a.lv==='U') { add('insp', t, LV[a.lv]+': inspección al instante'); add('esc', t, 'Afecta el uso: aviso en lenguaje simple'); }

    if (a.evac) add('dg', t, 'Evacuación: al instante'); else if (takenAt > t + 30*M) add('dg', t + 30*M, 'Emergencia sin "en camino" a los 30 min'); }
  if (a.lv==='U') {
    if (takenAt > t + 2*H && resAt > t + 2*H) add('sup', t + 2*H, 'Urgente sin "en camino" a las 2 h');
    if (closedAt > t + 24*H && resAt > t + 24*H) add('ger', t + 24*H, 'Urgente abierta a las 24 h');
    if (closedAt > t + 72*H && resAt > t + 72*H) add('dg', t + 72*H, 'Urgente abierta a las 72 h'); }

}

function allowed(t){ return t.roles==='*' || t.roles.split(' ').includes(role); }
function render(){
  if (!allowed(TABS.find(t=>t.id===tab))) tab = 'ini';
  now = Date.now() + OFF;
  document.getElementById('now').textContent = (OFF ? 'Hora simulada (+' + dur(OFF) + '): ' : 'Hora: ') + ISO(now);
  document.getElementById('nav').innerHTML = TABS.filter(allowed).map(t=>`<button type="button" data-tab="${t.id}" ${t.id===tab?'aria-current="page"':''}>${t.name}</button>`).join('');
  const rs = document.getElementById('rolSel'); rs.innerHTML = ROLES.map(r=>`<option value="${r.id}" ${r.id===role?'selected':''}>${h(r.who)} (${h(r.name)})</option>`).join('');
  const act = document.activeElement?.id;
  document.getElementById('view').innerHTML = V[tab]();
  if (act === 'audF') { const i = document.getElementById('audF'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
}

document.getElementById('rolSel').addEventListener('change', e => { const prev = role; role = e.target.value; try{localStorage.setItem('cent-esc-rol',role);}catch(_){} log(role,'Ingresó al sistema','Sesión','Cambio de usuario en la demo'); render(); });
document.addEventListener('input', e => { if (e.target.id === 'audF') { sel.audF = e.target.value; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('tr.click')) e.target.click(); });
document.addEventListener('click', e => {
  const tr = e.target.closest('tr.click');
  if (tr) { if (tr.dataset.os) sel.os = tr.dataset.os; if (tr.dataset.cer) sel.cerEmp = tr.dataset.cer; if (tr.dataset.edi) sel.edi = tr.dataset.edi; render(); return; }
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.tab) { tab = d.tab; render(); return; }
  if (d.go) { tab = d.go; render(); return; }
  if (d.act) { act(+d.id, d.act); return; }
  if (d.link) { window.open(d.link, '_blank'); return; }
  if (d.ostab) { sel.osTab = d.ostab; render(); return; }
  if (d.ex) { const v = (document.getElementById('exIn').value || '').trim(); const o = OS.find(x=>x.no===d.ex);
    if (!/^EX-\d{4}-\d{5,9}/.test(v)) { toast('Escribí un número con formato EX-2026-00000000-…'); return; }
    o.ex = v; o.mov.push({t:now, de:'Inspección', a:'Expediente ' + v.slice(0,19), motivo:'Vinculación a expediente'}); o.docs.push({doc:docNo('PV'), ref:'Pase', t:now}); log(role,'Vinculó expediente', o.no, v); toast('Expediente vinculado'); render(); return; }
  if (d.certif) { const s = cert(d.certif); log(role,'Generó informe de certificación', d.certif, `${M2S(curM())} · preventivo ${s.hecho}/${s.prog} · ${s.lateDays} días de atraso`); toast('Informe de certificación generado y registrado'); render(); return; }
  if (d.multa) { const s = cert(d.multa); log(role,'Propuso multa', d.multa, `${ars(s.multa)} por ${s.lateDays} días de atraso`); toast('Multa propuesta y registrada en auditoría'); render(); return; }
  if (d.hecho) { const p = PLAN[+d.hecho]; p.hecho = true; if (p.next < curM()) { p.last = curM(); p.next = curM() + p.f; p.hecho = null; } log(role,'Marcó preventivo hecho', `${esc(p.esc).n} · ${EQT[p.k].n}`, p.rut); toast('Preventivo registrado'); render(); return; }
  if (b.id==='t30') OFF += 30*M;
  if (b.id==='t2h') OFF += 2*H;
  if (b.id==='t24') OFF += D;
  if (b.id==='reset') { seed(); piFalla('normal', null); FIRED.clear(); renderSim(); toast('Demo reiniciada'); }
  if (b.id==='simBtn') { const p = document.getElementById('simPanel'); p.hidden = !p.hidden; b.setAttribute('aria-expanded', String(!p.hidden)); renderSim(); return; }
  if (d.sim) { fire(d.sim); return; }
  if (d.combo) { COMBOS[d.combo].sims.forEach(fire); (COMBOS[d.combo].pi||[]).forEach(f=>piFalla(f, true)); toast(COMBOS[d.combo].n + ': situación simulada'); return; }
  if (d.pf) { piFalla(d.pf, null); return; }
  if (b.id==='tgChk') { TG = !TG; renderSim(); return; }
  render();
});

function notifyTG(a){

  fetch(API + '/api/evento', {method:'POST', headers:{'Content-Type':'text/plain'},
    body: JSON.stringify({nivel:LVTG[a.lv], sitio:`${e.n} · ${e.c}`, equipo:a.eq, texto:`${a.txt}\n${a.dato}${a.why?'\n🧩 '+a.why:''}`})}).catch(()=>{});

function addAlert(def){
  const a = Object.assign({id: 100 + (++seq), t: now, st: 0}, def);
  A.push(a);
  log('op', 'Alerta detectada', `Alerta ${a.id}`, `${LV[a.lv]}${a.evac?' con evacuación':''} · ${esc(a.esc).n} · ${a.txt}`);
  return a;
}
function fire(k){
  if (FIRED.has(k)) return;
  now = Date.now() + OFF;
  const s = SIMS[k], a = addAlert(Object.fromEntries(Object.entries(s).filter(([x])=>x!=='n')));
  FIRED.add(k); notifyTG(a); renderSim(); render(); toast(`Simulado: ${s.n} · ${esc(s.esc).n}`);
}
function piFalla(f, on){

   <div class="simg"><h3>Varias a la vez</h3><div class="row">${Object.entries(COMBOS).map(([k,c])=>`<button type="button" class="btn sm pri" data-combo="${k}">${h(c.n)}</button>`).join('')}
    <button type="button" class="btn sm tg" id="tgChk" aria-pressed="${TG}">${TG?'✓ ':''}Avisar también por Telegram</button></div></div>`;
  try { localStorage.setItem('cent-tg', TG ? '1' : '0'); } catch(e) {}
}
function liveHTML(){
  const L = LIVE && LIVE.ultimo, simple = role==='esc';
  if (!LIVE_OK || !L) return `<div class="live"><div class="tq"><i style="height:0"></i><span>—</span></div><div><h2>Esc. Primaria N° 12 · tanque y bomba</h2><p class="note"><span class="pulse off"></span>Sin conexión con el sensor. ${API?'Revisá que la Raspberry esté prendida.':''}</p></div></div>`;
  const n = L.nivel_pct, u = LIVE.umbrales || {bajo:35, critico:15}, cls = n==null?'':n<u.critico?'c':n<u.bajo?'w':'';
  const lit = L.litros!=null ? L.litros.toLocaleString('es-AR') + ' L' : 'sin dato';
  const md = k => LIVE.modo && LIVE.modo[k]==='real' ? '<span class="chip ok">real</span>' : '<span class="chip of">simulado</span>';
  if (simple) return `<div class="live"><div class="tq"><i class="${cls}" style="height:${n||0}%"></i><span>${n==null?'—':Math.round(n)+' %'}</span></div>
    <div><h2><span class="pulse"></span>El agua de tu escuela, ahora</h2><div class="big">${n==null?'El sensor del tanque no responde. Ya se avisó.':n<u.critico?'Queda poca agua en el tanque.':n<u.bajo?'El tanque está bajo, se está llenando.':'Hay agua en el tanque.'}</div>
    <p class="note">Tanque: ${lit} · bomba ${L.bomba_on?'funcionando':'en reposo'}</p></div></div>`;
  return `<div class="live"><div class="tq"><i class="${cls}" style="height:${n||0}%"></i><span>${n==null?'—':Math.round(n)+' %'}</span></div>
   <div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div class="row sp"><h2><span class="pulse"></span>En vivo · Esc. Primaria N° 12 · tanque y bomba</h2>
    <span class="row"><button class="btn sm" type="button" data-link="/vivo">Tablero técnico</button><button class="btn sm" type="button" data-link="/analisis">📈 Tendencias</button></span></div>
   <div class="lm"><div><small>Nivel ${md('nivel')}</small><b>${n==null?'—':n.toFixed(0)+' %'}</b><small>${lit}</small></div>
    <div><small>Bomba</small><b>${L.bomba_on?'En marcha':'Parada'}</b><small>${L.bomba_on&&L.marcha_s?L.marcha_s+' s':''}</small></div>
    <div><small>Corriente ${md('corriente')}</small><b>${L.corriente_a==null?'—':L.corriente_a.toFixed(1)+' A'}</b><small>nominal ${LIVE.umbrales?.nominal ?? '—'} A</small></div>
    <div><small>Vibración ${md('vibracion')}</small><b>${L.vibracion_g==null?'—':L.vibracion_g.toFixed(3)+' g'}</b><small>alarma ${LIVE.umbrales?.vib ?? '—'} g</small></div></div>
   <span class="note">Alertas a Telegram: ${LIVE.telegram?'activas':'sin configurar'} · ${(LIVE.activas||[]).length?'fallas simuladas: '+LIVE.activas.length:'sin fallas simuladas'}</span></div></div>`;
}
function syncPi(){
  const act = (LIVE && LIVE.alertas) || [], keys = new Set(act.map(x=>x.clave));
  let changed = false;
  act.forEach(x => {
    const m = PI_MAP[x.clave]; if (!m) return;
    const dato = x.texto.split('\n').join(' · ');
    if (PIA[x.clave] && A.some(a=>a.id===PIA[x.clave] && a.st<3)) { const a = A.find(a=>a.id===PIA[x.clave]); if (a.dato !== dato) { a.dato = dato; } return; }
    const a = addAlert({lv:m.lv, esc:'e12', eq:m.eq, txt:m.txt, dato, plain:m.plain || undefined, why:m.why, ni:m.ni, live:true});
    PIA[x.clave] = a.id; changed = true;
  });
  Object.entries(PIA).forEach(([k,id]) => {
    if (keys.has(k)) return;
    const a = A.find(a=>a.id===id); delete PIA[k];
    if (a && a.st < 3) { a.st = 3; a.resAt = now; a.goAt ??= now; a.dato += ' · el sensor volvió a valores normales'; a.plain = 'El sensor volvió a valores normales. ¿Lo confirman?'; log('op','Normalizado por el sensor',`Alerta ${id}`, esc(a.esc).n); changed = true; }
  });
  return changed;
}
async function poll(){
  try {
    const r = await fetch(API + '/api/estado', {cache:'no-store'}); if (!r.ok) throw 0;
    LIVE = await r.json(); LIVE_OK = true;
  } catch(e) { LIVE_OK = false; }
  document.getElementById('connChip').innerHTML = LIVE_OK ? '<span class="pulse"></span>sensor real conectado' : '<span class="pulse off"></span>sin conexión con la Raspberry';
  now = Date.now() + OFF;
  const ch = LIVE_OK && syncPi();
  const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (ch && !typing) render(); else { const lb = document.getElementById('liveBox'); if (lb) lb.innerHTML = liveHTML(); document.getElementById('now').textContent = (OFF ? 'Hora simulada (+' + dur(OFF) + '): ' : 'Hora: ') + ISO(now); }
  renderSim();
}
seed(); render(); poll(); setInterval(poll, 2000);
})();
</script>
